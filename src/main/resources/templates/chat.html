<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetScan | Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #020617;
            --bg2: #0f172a;
            --panel: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent2: #3b82f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                    radial-gradient(circle at top, rgba(59,130,246,0.18), transparent 32%),
                    radial-gradient(circle at bottom right, rgba(34,197,94,0.12), transparent 28%),
                    linear-gradient(160deg, var(--bg1), var(--bg2));
        }

        .page-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 140px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand h3 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .brand span {
            color: var(--muted);
            font-size: 0.96rem;
        }

        .chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.10);
            color: #dbeafe;
            font-weight: 600;
            font-size: 0.92rem;
            white-space: nowrap;
        }

        .glass-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 70px rgba(0,0,0,0.35);
            overflow: hidden;
        }

        .answer-card {
            padding: 0;
            margin-bottom: 22px;
        }

        .answer-head {
            padding: 18px 22px;
            background: rgba(59,130,246,0.18);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .answer-head strong {
            color: #bfdbfe;
        }

        .answer-body {
            padding: 22px;
        }

        .markdown-body {
            color: var(--text);
            line-height: 1.75;
            font-size: 1rem;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            color: #fff;
            margin-top: 1.2rem;
            margin-bottom: 0.6rem;
            font-weight: 800;
        }

        .markdown-body ul {
            padding-left: 1.4rem;
            color: var(--text);
        }

        .markdown-body li {
            margin-bottom: 0.45rem;
        }

        .markdown-body code {
            background: rgba(255,255,255,0.10);
            padding: 0.18rem 0.42rem;
            border-radius: 8px;
            color: #93c5fd;
        }

        .markdown-body pre {
            background: #0b1120;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            overflow-x: auto;
        }

        .markdown-body strong {
            color: #60a5fa;
        }

        .composer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 18px 20px;
            background: linear-gradient(180deg, rgba(2,6,23,0), rgba(2,6,23,0.92) 25%, rgba(2,6,23,1));
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .composer-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        .input-shell {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 18px;
            padding: 10px;
        }

        .form-control {
            height: 56px;
            border-radius: 14px !important;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            color: white !important;
            box-shadow: none !important;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            border-color: rgba(59,130,246,0.8);
            background: rgba(255,255,255,0.07);
        }

        .btn-success {
            height: 56px;
            border: none;
            border-radius: 14px !important;
            font-weight: 700;
            padding: 0 22px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 12px 30px rgba(34,197,94,0.20);
        }

        .btn-success:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
        }

        .empty-state {
            padding: 64px 24px;
            text-align: center;
            color: var(--muted);
        }

        .empty-state h4 {
            color: #fff;
            font-weight: 800;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
            .brand h3 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <div class="brand">
            <h3>LeetScan Chat</h3>
            <span>Ask questions about the repository structure, code flow, and architecture.</span>
        </div>
        <div class="chip">AI Code Assistant</div>
    </div>

    <div th:if="${response}" class="glass-card answer-card shadow-lg">
        <div class="answer-head">
            <strong>You asked:</strong> <span th:text="${question}"></span>
        </div>
        <div class="answer-body">
            <div id="content" class="markdown-body" th:data-raw="${response}"></div>
        </div>
    </div>

    <div th:if="${response == null}" class="glass-card empty-state">
        <h4>Ready to analyze code</h4>
        <p class="mb-0">Ask a question about the repository and LeetScan will generate a context-aware answer.</p>
    </div>
</div>

<form th:action="@{/api/chat}" method="post" class="composer">
    <div class="composer-inner">
        <div class="input-shell">
            <div class="input-group">
                <input type="text" name="userPrompt" class="form-control"
                       placeholder="Ask about the code..." required autofocus>
                <button class="btn btn-success" type="submit">Ask Agent</button>
            </div>
        </div>
    </div>
</form>

<script>
    const contentDiv = document.getElementById('content');
    if (contentDiv) {
        const rawText = contentDiv.getAttribute('data-raw') || '';
        contentDiv.innerHTML = marked.parse(rawText);
    }
</script>
</body>
</html>
